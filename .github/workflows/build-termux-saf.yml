name: Build Limbo 6.0.1 with Termux SAF and Shared Directory

on:
  workflow_dispatch:
  push:
    branches: [fix/termux-saf-uri-access]
    paths:
      - "source/limbo code/**"
      - ".github/workflows/build-termux-saf.yml"

permissions:
  contents: read

concurrency:
  group: termux-shared-dir-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout the modified repository branch
        uses: actions/checkout@v4

      - name: Set up Java 17 for Android SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-29 build-tools;29.0.3"

      - name: Set up Java 11 for the legacy Android Gradle Plugin
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Install Gradle 7.0.2
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-7.0.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-7.0.2/bin" >> "$GITHUB_PATH"

      - name: Download original Limbo APK for its prebuilt native libraries
        env:
          APK_URL: "https://drive.usercontent.google.com/download?id=1qUtSoaH0hdTLIrQo0PHeeW-KQh1jWhkQ&export=download&confirm=t&uuid=4ddadc2e-396c-4904-819e-70595828805c"
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 "$APK_URL" -o /tmp/limbo-original.apk
          python3 - <<'PY'
          import zipfile
          p = "/tmp/limbo-original.apk"
          if not zipfile.is_zipfile(p):
              raise SystemExit("Native-library source download is not a valid APK.")
          with zipfile.ZipFile(p) as z:
              libs = [n for n in z.namelist() if n.startswith("lib/") and n.endswith(".so")]
              qemu = [n for n in libs if n.endswith("/libqemu-system-x86_64.so")]
              if len(qemu) != 4:
                  raise SystemExit(f"Expected four QEMU ABI libraries, found {len(qemu)}.")
          PY

      - name: Restore prebuilt native libraries into the checked-out source tree
        working-directory: source/limbo code
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          root = Path(".")
          with ZipFile("/tmp/limbo-original.apk") as apk:
              entries = [n for n in apk.namelist() if n.startswith("lib/") and n.endswith(".so")]
              for entry in entries:
                  _, abi, filename = entry.split("/", 2)
                  module = "limbo-android-x86" if filename == "libqemu-system-x86_64.so" else "limbo-android-lib"
                  target = root / module / "src/main/jniLibs" / abi / filename
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(apk.read(entry))
          for abi in ("arm64-v8a", "armeabi-v7a", "x86", "x86_64"):
              qemu = root / "limbo-android-x86/src/main/jniLibs" / abi / "libqemu-system-x86_64.so"
              if not qemu.is_file() or qemu.stat().st_size == 0:
                  raise SystemExit(f"Missing QEMU native library for {abi}")
          print("Native libraries restored from the original APK.")
          PY

      - name: Ensure Gradle wrapper
        working-directory: source/limbo code
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ] || [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 7.0.2 --distribution-type bin
          fi
          chmod +x gradlew

      - name: Run Shared Directory policy unit tests
        working-directory: source/limbo code
        run: ./gradlew --no-daemon :limbo-android-lib:testDebugUnitTest

      - name: Build modified x86 emulator APK
        working-directory: source/limbo code
        run: ./gradlew --no-daemon :limbo-android-x86:assembleDebug

      - name: Verify and stage APK
        run: |
          set -euo pipefail
          APK="$(find "source/limbo code/limbo-android-x86/build/outputs/apk/debug" -maxdepth 1 -name '*.apk' -type f | head -n1)"
          test -n "$APK"
          test -s "$APK"
          mkdir -p dist
          cp "$APK" dist/limbo-6.0.1-termux-shared-directory-debug.apk
          sha256sum dist/limbo-6.0.1-termux-shared-directory-debug.apk
          ls -lh dist/

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: limbo-6.0.1-termux-shared-directory-debug
          path: dist/limbo-6.0.1-termux-shared-directory-debug.apk
          if-no-files-found: error
          retention-days: 14
