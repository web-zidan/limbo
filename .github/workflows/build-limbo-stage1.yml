name: Build Limbo Android (stage 1)
on:
  push:
    branches:
      - limbo-upgrade-stage1
      - limbo-opengl-stage2
    paths:
      - "source/limbo code/**"
      - "source/bios/x64/**"
      - ".github/workflows/build-limbo-stage1.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-arm64:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      # Current Android command-line tools require JDK 17.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -path "*/bin/sdkmanager" -type f | sort | tail -1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-29" "build-tools;29.0.3" "ndk;23.1.7779620"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
      # This old Gradle/Android Gradle Plugin stack is compatible with JDK 11.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "11"
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake bison flex gettext gtk-doc-tools libtool libtool-bin make pkg-config python3 rsync texinfo wget curl xz-utils zip unzip meson ninja-build patchelf jq
      - name: Build Android ARM64 VirGL renderer (OpenGL guest acceleration)
        shell: bash
        run: |
          set -euo pipefail
          # VirGL translates guest OpenGL calls to the host EGL/GLES stack.
          # Vulkan/venus is intentionally disabled here: QEMU 5.1 in Limbo does
          # not implement the newer venus/rutabaga virtio-gpu interface.
          INSTALL_PREFIX="$RUNNER_TEMP/limbo-virgl"
          mkdir -p "$INSTALL_PREFIX" "$RUNNER_TEMP/epoxy-root"
          echo "ANDROID_VIRGL_PREFIX=$INSTALL_PREFIX" >> "$GITHUB_ENV"
          # Build libepoxy from source with the same Android NDK instead of
          # relying on a prebuilt archive's install layout.
          git clone --filter=blob:none https://github.com/DreamConnected/libepoxy-dev.git /tmp/libepoxy
          git -C /tmp/libepoxy checkout 39e20083b789caa2b88f9e8781d98545bbec5d4a
          sed -i "s|android-ndk-r28c|$ANDROID_SDK_ROOT/ndk/23.1.7779620|g" /tmp/libepoxy/aarch64-android-api30.txt
          meson setup /tmp/libepoxy/build /tmp/libepoxy \
            -Dglx=no \
            -Degl=yes \
            -Dtests=false \
            -Ddocs=false \
            --prefix="$INSTALL_PREFIX" \
            --libdir=lib \
            --cross-file=/tmp/libepoxy/aarch64-android-api30.txt
          meson compile -C /tmp/libepoxy/build
          meson install -C /tmp/libepoxy/build
          EPOXY_REAL="$(find "$INSTALL_PREFIX" -type f -name 'libepoxy.so*' 2>/dev/null | sort -V | tail -1)"
          test -n "$EPOXY_REAL"
          patchelf --set-soname libepoxy.so "$EPOXY_REAL"
          EPOXY_PC="$(find "$INSTALL_PREFIX" -type f -name 'epoxy.pc' -print -quit)"
          test -n "$EPOXY_PC"
          # libepoxy's Android cross-build has no .pc metadata for platform EGL,
          # so Meson may emit an empty Requires.private field. Older pkg-config
          # rejects that field instead of treating it as an empty dependency list.
          sed -i '/^Requires/d' "$EPOXY_PC"
          if grep -q '^Requires' "$EPOXY_PC"; then
            echo "Could not sanitize empty Requires fields in $EPOXY_PC" >&2
            grep -n '^Requires' "$EPOXY_PC" >&2 || true
            exit 1
          fi
          grep -n '^Requires' "$EPOXY_PC" || true
          export PKG_CONFIG_PATH="$(dirname "$EPOXY_PC"):$INSTALL_PREFIX/lib/pkgconfig:$INSTALL_PREFIX/lib64/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          git clone --filter=blob:none https://github.com/Container-On-Android/virglrenderer.git /tmp/virglrenderer
          git -C /tmp/virglrenderer checkout 30b31117cffe52f73d3520abe67c5a1c2f2ef3a0
          # Android NDK's UAPI dma-buf header uses kernel-internal u64 in
          # DMA_BUF_SET_NAME_B. Provide the UAPI-equivalent type for this build.
          python3 - <<'PY'
          from pathlib import Path
          path = Path("/tmp/virglrenderer/src/virgl_util.c")
          source = path.read_text()
          needle = "#ifdef HAVE_DMABUF_H\n#include <linux/dma-buf.h>"
          replacement = "#ifdef HAVE_DMABUF_H\n#include <linux/types.h>\ntypedef __u64 u64;\n#include <linux/dma-buf.h>"
          if needle not in source:
              raise SystemExit("Could not apply Android dma-buf u64 compatibility patch")
          path.write_text(source.replace(needle, replacement, 1))
          PY
          sed -i "s|android-ndk-r28c|$ANDROID_SDK_ROOT/ndk/23.1.7779620|g" /tmp/virglrenderer/aarch64-android-api30.txt
          export PKG_CONFIG_PATH="$INSTALL_PREFIX/lib/pkgconfig:$INSTALL_PREFIX/lib64/pkgconfig:${PKG_CONFIG_PATH:-}"
          meson setup /tmp/virglrenderer/build /tmp/virglrenderer \
            -Dvenus=false \
            -Dvulkan-dload=false \
            -Dplatforms=egl \
            -Dvideo=false \
            -Drender-server-worker=thread \
            -Ddrm-renderers= \
            -Dtests=false \
            -Dfuzzer=false \
            -Dvalgrind=false \
            -Dtracing=none \
            --prefix="$INSTALL_PREFIX" \
            --libdir=lib \
            --cross-file=/tmp/virglrenderer/aarch64-android-api30.txt
          meson compile -C /tmp/virglrenderer/build
          meson install -C /tmp/virglrenderer/build
          VIRGL_REAL="$(find "$INSTALL_PREFIX/lib" "$INSTALL_PREFIX/lib64" -maxdepth 1 -type f -name 'libvirglrenderer.so*' 2>/dev/null | sort -V | tail -1)"
          test -n "$VIRGL_REAL"
          patchelf --set-soname libvirglrenderer.so "$VIRGL_REAL"
          test -s "$(find "$INSTALL_PREFIX/lib" "$INSTALL_PREFIX/lib64" -maxdepth 2 -name 'virglrenderer.pc' -print -quit)"
          echo "PKG_CONFIG_PATH=$INSTALL_PREFIX/lib/pkgconfig:$INSTALL_PREFIX/lib64/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"
          echo "ANDROID_VIRGL_LIB_DIR=$INSTALL_PREFIX/lib" >> "$GITHUB_ENV"
          echo "Built Android VirGL library: $VIRGL_REAL"
      - name: Download QEMU and matching historical dependencies
        shell: bash
        run: |
          set -euo pipefail
          JNI="source/limbo code/limbo-android-lib/src/main/jni"
          mkdir -p /tmp/limbo-deps
          cd /tmp/limbo-deps
          curl -fL --retry 3 https://download.qemu.org/qemu-5.1.0.tar.xz -o qemu-5.1.0.tar.xz
          curl -fL --retry 3 https://download.gnome.org/sources/glib/2.56/glib-2.56.1.tar.xz -o glib-2.56.1.tar.xz
          curl -fL --retry 3 https://sourceware.org/pub/libffi/libffi-3.3.tar.gz -o libffi-3.3.tar.gz
          curl -fL --retry 3 https://www.cairographics.org/releases/pixman-0.40.0.tar.gz -o pixman-0.40.0.tar.gz
          curl -fL --retry 3 https://www.libsdl.org/release/SDL2-2.0.8.tar.gz -o SDL2-2.0.8.tar.gz
          tar -xJf qemu-5.1.0.tar.xz
          tar -xJf glib-2.56.1.tar.xz
          tar -xzf libffi-3.3.tar.gz
          tar -xzf pixman-0.40.0.tar.gz
          tar -xzf SDL2-2.0.8.tar.gz
          cd "$GITHUB_WORKSPACE/$JNI"
          mv /tmp/limbo-deps/qemu-5.1.0 qemu
          mv /tmp/limbo-deps/glib-2.56.1 glib
          mv /tmp/limbo-deps/libffi-3.3 libffi
          mv /tmp/limbo-deps/pixman-0.40.0 pixman
          mv /tmp/limbo-deps/SDL2-2.0.8 SDL2
          patch -d qemu -p1 < patches/qemu-5.1.0.patch
          # Android has EGL/GLES but not Mesa GBM. QEMU 5.1's OpenGL probe
          # otherwise requires both epoxy and GBM even for SDL's EGL path.
          sed -i 's/opengl_pkgs="epoxy gbm"/opengl_pkgs="epoxy"/' qemu/configure
          patch -d glib -p1 < patches/glib-2.56.1.patch
          patch -d SDL2 -p1 < patches/sdl2-2.0.8.patch

          # Rebuild the latest released SeaBIOS ROM against the QEMU 5.1 firmware interface.
          curl -fL --retry 3 https://www.seabios.org/downloads/seabios-1.17.0.tar.gz -o /tmp/limbo-deps/seabios-1.17.0.tar.gz
          tar -xzf /tmp/limbo-deps/seabios-1.17.0.tar.gz -C /tmp/limbo-deps
          # Build outside the repository path because legacy SeaBIOS Makefiles mishandle spaces.
          make -C /tmp/limbo-deps/seabios-1.17.0 -j2
          test -s /tmp/limbo-deps/seabios-1.17.0/out/bios.bin
          cp /tmp/limbo-deps/seabios-1.17.0/out/bios.bin qemu/pc-bios/bios-256k.bin
      - name: Build native QEMU shared library
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export NDK_ROOT="$ANDROID_SDK_ROOT/ndk/23.1.7779620"
          export USE_GCC=false
          export BUILD_HOST=arm64-v8a
          export BUILD_GUEST=x86_64-softmmu
          export USE_QEMU_VERSION=5.1.0
          export USE_AAUDIO=false
          export BUILD_THREADS=3
          # The original directory contains a space ("limbo code"), but legacy
          # GNU Make recipes do not quote all paths. Build from a space-free copy.
          rm -rf /tmp/limbo-source
          cp -a "source/limbo code" /tmp/limbo-source
          cd /tmp/limbo-source/limbo-android-lib/src/main/jni
          make limbo
      - name: Add bundled x86_64 OVMF firmware assets
        shell: bash
        run: |
          set -euo pipefail
          ASSETS="/tmp/limbo-source/limbo-android-x86/src/main/assets/roms"
          mkdir -p "$ASSETS"
          cp source/bios/x64/code.fd "$ASSETS/OVMF_CODE.fd"
          cp source/bios/x64/vars.fd "$ASSETS/OVMF_VARS.fd"
          test -s "$ASSETS/OVMF_CODE.fd"
          test -s "$ASSETS/OVMF_VARS.fd"
          # Package the Android-built VirGL and epoxy shared libraries beside QEMU.
          # Android's linker resolves DT_NEEDED libraries only if they are in the APK ABI dir.
          JNILIBS="/tmp/limbo-source/limbo-android-x86/src/main/jniLibs/arm64-v8a"
          mkdir -p "$JNILIBS"
          for LIB in libvirglrenderer.so libepoxy.so; do
            REAL="$(find "$ANDROID_VIRGL_PREFIX/lib" "$ANDROID_VIRGL_PREFIX/lib64" -maxdepth 1 -type f -name "$LIB*" 2>/dev/null | sort -V | tail -1)"
            test -n "$REAL"
            cp "$REAL" "$JNILIBS/$LIB"
            test -s "$JNILIBS/$LIB"
          done
          QEMU_LIB="/tmp/limbo-source/limbo-android-x86/src/main/jniLibs/arm64-v8a/libqemu-system-x86_64.so"
          test -s "$QEMU_LIB"
          NEEDED="$ANDROID_SDK_ROOT/ndk/23.1.7779620/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          "$NEEDED" -d "$QEMU_LIB" | grep -E 'libvirglrenderer\.so|libepoxy\.so'
      - name: Generate Gradle wrapper and build release APK
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://services.gradle.org/distributions/gradle-6.5-bin.zip -o /tmp/gradle-6.5-bin.zip
          unzip -q /tmp/gradle-6.5-bin.zip -d /tmp
          cd /tmp/limbo-source
          /tmp/gradle-6.5/bin/gradle wrapper --gradle-version 6.5 --distribution-type bin
          chmod +x gradlew
          ./gradlew --no-daemon :limbo-android-x86:assembleRelease
          APK="$(find limbo-android-x86/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' ! -name '*-signed.apk' -print -quit)"
          test -n "$APK"
          test -s "$APK"
          echo "Built unsigned APK: $APK"

          # Produce an installable development-signed APK. This key is not the official Limbo signing key.
          BUILDTOOLS="$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -x "$BUILDTOOLS/apksigner"
          SIGNED="$PWD/limbo-android-x86/build/outputs/apk/release/limbo-android-x86-release-arm64-signed.apk"
          keytool -genkeypair -noprompt -v \
            -keystore /tmp/limbo-upgrade.keystore -storepass android \
            -alias limbo-upgrade -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Limbo Upgrade Build,O=Development,C=ID"
          # AGP's release packaging already zip-aligns this APK; sign it directly.
          "$BUILDTOOLS/apksigner" sign \
            --ks /tmp/limbo-upgrade.keystore --ks-pass pass:android \
            --key-pass pass:android --out "$SIGNED" "$APK"
          "$BUILDTOOLS/apksigner" verify --verbose "$SIGNED"
          unzip -t "$SIGNED"
          unzip -l "$SIGNED" > /tmp/limbo-upgrade-apk-list.txt
          grep -q "lib/arm64-v8a/libqemu-system-x86_64.so" /tmp/limbo-upgrade-apk-list.txt
          grep -q "assets/roms/OVMF_CODE.fd" /tmp/limbo-upgrade-apk-list.txt
          grep -q "assets/roms/OVMF_VARS.fd" /tmp/limbo-upgrade-apk-list.txt
          echo "Verified signed APK: $SIGNED"
      - uses: actions/upload-artifact@v4
        with:
          name: limbo-opengl-stage2-arm64-signed-apk
          path: /tmp/limbo-source/limbo-android-x86/build/outputs/apk/release/*-signed.apk
          if-no-files-found: error
          retention-days: 14
